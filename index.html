<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GALAGA</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="cabinet">
      <canvas id="game" width="224" height="288"></canvas>

      <!-- Touch controls, shown only on coarse pointers. The slide strip sits
           below the playfield so the thumb never covers the game; the ship
           fires by itself. -->
      <div id="touch" class="hidden">
        <div
          id="pad"
          role="slider"
          tabindex="-1"
          aria-label="Slide to move the ship"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="50"
        >
          <div id="pad-track"></div>
          <div id="pad-knob"></div>
          <span id="pad-label">SLIDE TO MOVE</span>
        </div>
        <div id="touch-side">
          <button id="t-pause" class="tbtn tbtn-sm" type="button" aria-label="Pause">&#8214;</button>
          <button id="t-mute" class="tbtn tbtn-sm" type="button" aria-label="Mute">&#128265;</button>
        </div>
      </div>

      <p id="legend">
        <b>&#8592;</b> <b>&#8594;</b> move &nbsp;&middot;&nbsp; <b>SPACE</b> fire
        &nbsp;&middot;&nbsp; <b>P</b> pause &nbsp;&middot;&nbsp; <b>M</b> mute
      </p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
