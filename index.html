<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GALAGA</title>
    <!-- Relative, not /src/... : an absolute path resolves to the domain root,
         which breaks when the site is served from a subpath like /galaga/. -->
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- The cockpit view fills the screen, and the arcade canvas lies over it as
         a transparent overlay carrying the score, banners and title. In ?flat
         mode the 3D canvas is never created and the arcade canvas draws the
         whole game itself, centred, exactly as it used to. Everything in here
         is placed by main.js, the one place that knows the layout. -->
    <div id="stage">
      <canvas id="view3d"></canvas>
      <canvas id="game" width="224" height="288"></canvas>

      <!-- Touch controls, shown only on coarse pointers. The ring sits over the
           cockpit's control column: put a thumb on it and push, and the stick
           goes with you. The ship fires by itself. -->
      <div
        id="stick"
        class="hidden"
        role="slider"
        tabindex="-1"
        aria-label="Control stick: push left or right to fly"
        aria-valuemin="-100"
        aria-valuemax="100"
        aria-valuenow="0"
      ></div>

      <!-- Up on the score row, well clear of the thumb that is flying. -->
      <div id="hud-buttons" class="hidden">
        <button id="t-view" class="tbtn" type="button" aria-label="Outside view">&#128760;</button>
        <button id="t-pause" class="tbtn" type="button" aria-label="Pause">&#8214;</button>
        <button id="t-mute" class="tbtn" type="button" aria-label="Mute">&#128265;</button>
      </div>
    </div>

    <!-- Never seen: main.js reads the safe area off it, since env() values are
         only available to CSS. -->
    <div id="safe" aria-hidden="true"></div>

    <p id="legend">
      <b>&#8592;</b> <b>&#8594;</b> fly &nbsp;&middot;&nbsp; <b>SPACE</b> fire
      &nbsp;&middot;&nbsp; <b>V</b> view &nbsp;&middot;&nbsp; <b>P</b> pause
      &nbsp;&middot;&nbsp; <b>M</b> mute
    </p>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
