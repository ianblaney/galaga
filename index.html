<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GALAGA</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="cabinet">
      <canvas id="game" width="224" height="288"></canvas>

      <!-- Touch controls, shown only on coarse pointers. Dragging on the
           playfield is the primary control; these are the fallback plus the
           pause/mute that a phone has no keyboard for. -->
      <div id="touch" class="hidden">
        <button id="t-left" class="tbtn" type="button" aria-label="Move left">&#9664;</button>
        <button id="t-fire" class="tbtn tbtn-fire" type="button" aria-label="Fire">FIRE</button>
        <button id="t-right" class="tbtn" type="button" aria-label="Move right">&#9654;</button>
        <button id="t-pause" class="tbtn tbtn-sm" type="button" aria-label="Pause">&#8214;</button>
        <button id="t-mute" class="tbtn tbtn-sm" type="button" aria-label="Mute">&#128265;</button>
      </div>

      <p id="touch-hint">Drag on the screen to fly &middot; auto-fires while held</p>

      <p id="legend">
        <b>&#8592;</b> <b>&#8594;</b> move &nbsp;&middot;&nbsp; <b>SPACE</b> fire
        &nbsp;&middot;&nbsp; <b>P</b> pause &nbsp;&middot;&nbsp; <b>M</b> mute
      </p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
